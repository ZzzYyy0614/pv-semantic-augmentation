name: CPU validation
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src/pvaug tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
      - run: pvaug smoke --output runs/ci-smoke
      - run: pvaug pipeline --config configs/pipelines/paper.yaml --dry-run
      - run: pvaug sweep --config configs/sweeps/fusion.yaml --dry-run
