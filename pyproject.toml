[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-semantic-edge"
version = "0.2.0"
description = "A modular research framework for semantic-aware EL augmentation and edge-prior recognition"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "third_party/*LICENSE"]
authors = [{name = "Yu Zhu"}]
dependencies = [
  "torch>=2.5,<2.6", "torchvision>=0.20,<0.21",
  "numpy>=1.26,<3", "Pillow>=10,<12", "einops>=0.8,<0.9", "omegaconf>=2.3,<2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<0.10"]

[project.scripts]
pvaug = "pvaug.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pvaug = ["_licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["reference", "src/pvaug/vendor", "src/pvaug/models/recovered"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
