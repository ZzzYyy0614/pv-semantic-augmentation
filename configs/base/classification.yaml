schema_version: 2
task: classification
data:
  manifest: data/real.csv
  generated_manifest: null
  classes: [defect_free, micro_crack, busbar_corrosion, break, black_core]
  image_size: 224
  normalize: true
  generated_ratio: 1.0
  conventional_augmentation: false
  resample_defects: false
model:
  backbone: resnet18
  variant: paper
  edge_prior: true
  fusion: true
  fusion_kind: gated
  pretrained: false
  gate_reduction: 4
  edge_width_ratio: 1.0
optimizer:
  name: sgd
  lr: 0.0005
  momentum: 0.9
  weight_decay: 0.05
  schedule: constant
trainer:
  epochs: 100
  batch_size: 24
  workers: 0
  device: auto
  max_steps: null
  engine:
    precision: fp32
    accumulation_steps: 1
    clip_grad_norm: null
    checkpoint_every: 1
semantic:
  teacher: null
  temperature: 15.0
  alpha_start: 0.7
  alpha_end: 0.3
experiment:
  output: runs/classification
  seed: 42
